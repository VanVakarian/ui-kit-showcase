<div class="flex flex-row *:p-4 *:w-96">
  <div v-style="flat-style"
       v-theme="flat-blue"
       class="flex flex-col gap-6">
    <h2 class="mb-0 text-2xl font-semibold">v-input :not(.dark)</h2>
    <ng-container *ngTemplateOutlet="inputShowcase" />
  </div>

  <div v-style="flat-style"
       v-theme="flat-blue"
       class="dark flex flex-col gap-6">
    <h2 class="mb-0 text-2xl font-semibold">v-input .dark</h2>
    <ng-container *ngTemplateOutlet="inputShowcase" />
  </div>
</div>

<ng-template #inputShowcase>
  <section class="my-0">
    <h3 class="my-0 text-xl font-semibold">Basic Inputs</h3>
    <div class="flex flex-col gap-4">

      <v-input class="w-48"
               [config]="{
                 placeholder: 'Enter text...',
               }" />

      <v-input [config]="{
                 isDisabled: true,
                 placeholder: 'Disabled input',
               }" />

      <v-input [config]="{
                 isReadonly: true,
                 placeholder: 'Readonly input',
               }" />

    </div>
  </section>

  <section>
    <h3 class="text-xl font-semibold">Auto Submit</h3>
    <div class="flex flex-col gap-3">
      <v-input [config]="{
                 label: 'Auto submit input',
                 placeholder: 'Start typing...',
                 isAutoSubmitEnabled: true,
                 autoSubmitDelay: 2500,
                 autoSubmitResult: autoSubmitResult$$(),
               }"
               (onAutoSubmit)="handleAutoSubmit($event)" />

      @if (autoSubmitStatusText$$()) {
        <p class="text-slate-600 text-sm">{{ autoSubmitStatusText$$() }}</p>
      }
    </div>
  </section>

  <section>
    <h3 class="text-xl font-semibold">Input Types</h3>
    <form [formGroup]="form"
          class="flex flex-col gap-4">

      <v-input formControlName="username"
               [config]="{
                 label: 'Username',
                 placeholder: 'Enter your username',
               }" />

      <v-input formControlName="email"
               [config]="{
                 label: 'Email',
                 placeholder: 'example@email.com',
                 type: 'email',
               }" />

      <v-input formControlName="password"
               [config]="{
                 label: 'Password',
                 placeholder: 'Enter password',
                 type: 'password',
               }" />

      <v-input formControlName="disabled"
               [config]="{
                 label: 'Disabled Field',
                 placeholder: 'This field is disabled',
               }" />

      <v-input formControlName="error"
               [config]="{
                 label: 'Field with Error',
                 placeholder: 'Enter something',
               }" />

    </form>
  </section>

  <section>
    <h3 class="text-xl font-semibold">Inputs with Prefix/Postfix</h3>
    <div class="flex flex-col gap-4"
         [formGroup]="form">
      <v-input formControlName="testInput">
        <span v-prefix
              class="px-2">$</span>
        <button v-postfix
                type="button"
                class="w-7 h-7">🔍</button>
      </v-input>

      <v-input formControlName="testInput">
        <v-button class="v-link v-link-static mr-2"
                  v-prefix
                  [config]="{
                    isWithoutShadow: true,
                    bgOpacity: '0.5',
                    padding: 0,
                  }"
                  (click)="consoleLogFormValue()">
          <v-icon [name]="Icon.Close"
                  [size]="8" />
        </v-button>
        <button v-postfix
                type="button"
                class="w-7 h-7">🔍</button>
      </v-input>
    </div>
  </section>

  <section>
    <h3 class="text-xl font-semibold">Textarea</h3>
    <div class="flex flex-col gap-4">
      <v-input [config]="{
                 label: 'Description',
                 placeholder: 'Enter description...',
                 isTextarea: true,
                 rows: 4,
               }" />
    </div>
  </section>
</ng-template>
